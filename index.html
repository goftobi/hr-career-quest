สานสินเชื่อสถาบันการเงิน","บริหารกองทุนสำรองเลี้ยงชีพ คัดกรองขอพระราชทานเครื่องราชอิสริยาภรณ์ จัดหาประกัน D&O และ FIPI","จัดหานักคณิตศาสตร์ประกันภัย (Actuarial) คำนวณผลประโยชน์พนักงานเพื่อปิดงบการเงินประจำปี และปฏิบัติงานสารบรรณของฝ่าย"]},{id:"codex-hrm-welfare",division:"hrm",parentLine:"รองผู้อำนวยการฝ่ายบริหารทรัพยากรบุคคล",titleTh:"3. ส่วนสวัสดิการและสิทธิประโยชน์",titleEn:"Welfare and Benefits",orderRef:"คำสั่ง ธพว. ที่ 51/2566",highlights:["ดำเนินการสวัสดิการเงินกู้เพื่อที่อยู่อาศัยของพนักงาน ตั้งแต่รับคำขอ ประชุมคณะกรรมการเงินกู้ นิติกรรม เบิกจ่าย จนถึงไถ่ถอนปิดบัญชี","ดูแลการรักษาพยาบาล สถานพยาบาล SME-D ตรวจสุขภาพประจำปี ประกันชีวิต ประกันอุบัติเหตุ และกองทุนสวัสดิการพนักงาน (บวช/แต่ง/ศพ/ภัยธรรมชาติ)","ดำเนินการด้านฌาปนกิจสงเคราะห์ สนับสนุนการจ้างงานคนพิการตามกฎหมาย ดูแลร้านค้าสวัสดิการและชุดเครื่องแบบพนักงาน","เป็นศูนย์กลางด้านกิจการสัมพันธ์ตาม พ.ร.บ.แรงงานรัฐวิสาหกิจสัมพันธ์ ประสานคณะกรรมการกิจการสัมพันธ์และสหภาพแรงงานรัฐวิสาหกิจ ธพว.","ดูแลความปลอดภัย อาชีวอนามัย และสภาพแวดล้อมในการทำงาน (คปอ.) และรับฟังปัญหาข้อเสนอแนะเพื่อขจัดข้อขัดแย้ง"]},{id:"codex-hrm-assess",division:"hrm",parentLine:"รองผู้อำนวยการฝ่ายบริหารทรัพยากรบุคคล",titleTh:"4. ส่วนประเมินผลและเสริมสร้างความก้าวหน้าบุคลากร",titleEn:"Assessment & Career Path",orderRef:"คำสั่ง ธพว. ที่ 51/2566",highlights:["จัดทำแผนปฏิบัติการและตัวชี้วัดฝ่าย (DPIs), ตัวชี้วัดรายบุคคล (KPIs) และพจนานุกรมสมรรถนะ (Core, Managerial/Leadership, Functional Competency)","กำกับดูแลระบบบริหารผลการปฏิบัติงาน (PMS) และจัดประเมินสมรรถนะเพื่อส่งต่อข้อมูลจัดทำแผนพัฒนาบุคลากร","บริหารความก้าวหน้าสายอาชีพ (Career Path) สรรหาคัดเลือกปรับระดับภายใน หมุนเวียนงาน (Rotation) ตาม Job Family","ร่วมกับฝ่ายพัฒนาทรัพยากรบุคคลฯ จัดทำแผนสืบทอดตำแหน่ง (Successor) และบริหารคลังข้อมูลคนเก่ง (Talent Pool)","เป็นศูนย์กลางรับเรื่องอุทธรณ์/ร้องทุกข์ผลประเมิน และประสานงาน ธปท. (ระบบ E-Application) ขอความเห็นชอบผู้บริหารระดับสูง"]},{id:"codex-hrd-strategy",division:"hrd",parentLine:"รองผู้อำนวยการด้านพัฒนาองค์กร",titleTh:"1. ส่วนกลยุทธ์ทรัพยากรบุคคลและหุ้นส่วนการทำงาน",titleEn:"HR Strategy & HR Business Partner",orderRef:"คำสั่ง ธพว. ที่ 52/2566",highlights:["จัดทำและทบทวนยุทธศาสตร์ กลยุทธ์ เป้าหมาย และตัวชี้วัด HR ระยะยาว (แผนแม่บท) และระยะสั้น (แผนปฏิบัติการ)","ทบทวนหลักเกณฑ์นโยบาย HR เช่น Career Path, Promotion, Successor, Talent, KPIs, Competency และโครงสร้างค่าตอบแทน-สวัสดิการ","จัดทำงบประมาณรายจ่ายประจำปีของฝ่าย และจัดประชุมคณะกรรมการสรรหาและกำหนดค่าตอบแทน (คสก.)","ดำเนินงานสอบทานกระบวนการทำงานสำคัญด้าน HR ตามเกณฑ์การประเมินคุณภาพรัฐวิสาหกิจ ด้าน HCM","สนับสนุนงาน HR ให้หน่วยงานภายในแบบหุ้นส่วนการทำงาน (HRBP) และทำ HR Analytics เพื่อวางกลยุทธ์"]},{id:"codex-hrd-od",division:"hrd",parentLine:"รองผู้อำนวยการด้านพัฒนาองค์กร",titleTh:"2. ส่วนพัฒนาองค์กร",titleEn:"Organization Development",orderRef:"คำสั่ง ธพว. ที่ 52/2566",highlights:["จัดทำแผนโครงสร้างกรอบอัตรากำลัง (Workforce Landscape) ระยะยาว-ระยะสั้น และบริหารอัตรากำลัง (Manpower Planning)","นำเสนอโครงสร้างองค์กร ภาระหน้าที่ ชื่อภาษาอังกฤษ/อักษรย่อ Corporate Title, Functional Title รวมถึงจัดทำ JD และ Job Specification","จัดทำ ปรับปรุง ทบทวน ข้อบังคับ ระเบียบ คำสั่ง หลักเกณฑ์ด้านทรัพยากรบุคคล เสนอขออนุมัติและประกาศให้พนักงานทราบ","ปรับปรุงโครงสร้างหน่วยงานในระบบ HRMS ให้เป็นปัจจุบัน ครบถ้วน และถูกต้อง พร้อมทำ HR Analytics ด้านโครงสร้างและอัตรากำลัง"]},{id:"codex-hrd-culture",division:"hrd",parentLine:"รองผู้อำนวยการด้านพัฒนาทรัพยากรบุคคล",titleTh:"3. ส่วนส่งเสริมวัฒนธรรมองค์กรและความผูกพันบุคลากร",titleEn:"SMEDS Culture & Engagement",orderRef:"คำสั่ง ธพว. ที่ 52/2566",highlights:["จัดทำแผนงานและกิจกรรมส่งเสริมวัฒนธรรมองค์กร (SMEDS) และขับเคลื่อนการเปลี่ยนแปลงของธนาคาร (Change Management)","ส่งเสริมความผูกพันบุคลากร สำรวจความพึงพอใจและความผูกพัน เป็นศูนย์กลางรับฟังความคิดเห็นเพื่อยกระดับ Engagement","ออกแบบสื่อประชาสัมพันธ์ กิจกรรม และผลงานด้าน HR (เช่น รางวัลด้านสิทธิมนุษยชน)","รับผิดชอบและสนับสนุนงานตัวแทน HR ประจำหน่วยงาน และขับเคลื่อนองค์กรต้นแบบด้านสิทธิมนุษยชนของธนาคาร"]},{id:"codex-hrd-academy",division:"hrd",parentLine:"รองผู้อำนวยการด้านพัฒนาทรั
